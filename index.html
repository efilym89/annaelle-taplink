  .ae-t123-record,
  .ae-t123-record .t123,
  .ae-t123-record .t-container,
  .ae-t123-record .t-container_100,
  .ae-t123-record .t-width,
  .ae-t123-record .t-width_100,
  .ae-t123-record .t123__html {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  #annaelle-t123 {
    --ae-ink: #231f20;
    --ae-rose: #b77a88;
    --ae-rose-dark: #9e6573;
    --ae-rose-soft: #e8d6da;
    --ae-blush: #f3e4ea;
    --ae-ivory: #fef7fb;
    --ae-paper: #fffafc;
    --ae-olive: #b1b795;
    --ae-olive-glass: rgba(177, 183, 149, 0.64);
    --ae-olive-dark: #8f9671;
    --ae-olive-soft: #e7e8dd;
    --ae-rose-glass: rgba(183, 122, 136, 0.7);
    --ae-peach: #edd8cb;
    --ae-peach-soft: #fff5ef;
    position: relative;
    isolation: isolate;
    display: block;
    width: 100%;
    max-width: none;
    margin: 0;
    overflow: hidden;
    color: var(--ae-ink);
    background:
      linear-gradient(180deg, rgba(254, 247, 251, 0.22), rgba(255, 250, 252, 0.68)),
      var(--ae-ivory);
    font-family: "Annaelle Gilroy", "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.4;
    font-synthesis: none;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: auto;
  }

  #annaelle-t123,
  #annaelle-t123 *,
  #annaelle-t123 *::before,
  #annaelle-t123 *::after {
    box-sizing: border-box;
  }

  #annaelle-t123::before {
    position: absolute;
    z-index: -1;
    inset: 0;
    content: "";
    opacity: 0.18;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.10'/%3E%3C/svg%3E");
  }

  #annaelle-t123 .ae-content {
    --ae-page-gutter: clamp(16px, 5.15vw, 20px);
    position: relative;
    width: min(100%, 540px);
    margin: 0 auto;
    padding: 24px var(--ae-page-gutter) 16px;
  }

  #annaelle-t123 .ae-shape {
    position: absolute;
    z-index: -2;
    border-radius: 999px;

      Array.prototype.forEach.call(tabs, function (tab) {
        tab.addEventListener("click", function () {

          }

          if (mapLink) {
            mapLink.href = tab.getAttribute("data-map-link");
          }

      });
    }
